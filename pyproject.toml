[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grabr"
version = "0.1.0"
description = "Download audio from YouTube Music and Spotify links"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "grabr" }]
dependencies = [
  "click==8.1.7",
  "rich==13.9.4",
  "yt-dlp==2025.2.19",
  "spotdl==4.2.11",
  "mutagen==1.47.0",
]

[project.scripts]
grabr = "grabr.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["grabr*"]
